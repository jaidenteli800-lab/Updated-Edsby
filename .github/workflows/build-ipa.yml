name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fixed.zip
        run: |
          mkdir -p extracted
          unzip -q fixed.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Xcode project
        id: find_project
        run: |
          PROJECT=$(find extracted -name "*.xcodeproj" -print -quit)
          WORKSPACE=$(find extracted -name "*.xcworkspace" -print -quit)

          if [ -n "$WORKSPACE" ]; then
            echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "Using workspace: $WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
            echo "Using project: $PROJECT"
          else
            echo "No .xcodeproj or .xcworkspace found!"
            exit 1
          fi

      - name: Show schemes
        run: |
          if [ -n "${{ steps.find_project.outputs.workspace }}" ]; then
            xcodebuild -list \
              -workspace "${{ steps.find_project.outputs.workspace }}"
          else
            xcodebuild -list \
              -project "${{ steps.find_project.outputs.project }}"
          fi

      - name: Build unsigned app
        run: |
          mkdir -p build

          if [ -n "${{ steps.find_project.outputs.workspace }}" ]; then
            xcodebuild \
              -workspace "${{ steps.find_project.outputs.workspace }}" \
              -scheme "$(xcodebuild -list -workspace "${{ steps.find_project.outputs.workspace }}" | sed -n '/Schemes:/,/^$/p' | tail -n +2 | head -1 | xargs)" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            xcodebuild \
              -project "${{ steps.find_project.outputs.project }}" \
              -scheme "$(xcodebuild -list -project "${{ steps.find_project.outputs.project }}" | sed -n '/Schemes:/,/^$/p' | tail -n +2 | head -1 | xargs)" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "No .app was produced!"
            exit 1
          fi

          echo "Found app: $APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -qry Unsigned.ipa Payload

          echo "Created:"
          ls -lh Unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: Unsigned.ipa
