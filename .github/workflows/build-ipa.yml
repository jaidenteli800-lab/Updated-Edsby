name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fixed.zip
        shell: bash
        run: |
          set -e

          rm -rf extracted Payload build
          mkdir -p extracted

          unzip -q fixed.zip -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 3 -print

      - name: Check Xcode project
        shell: bash
        run: |
          set -e

          if [ ! -d "extracted/DCDSBFresh.xcodeproj" ]; then
            echo "ERROR: DCDSBFresh.xcodeproj was not found."
            exit 1
          fi

          echo "Found DCDSBFresh.xcodeproj"

      - name: Find Xcode scheme
        shell: bash
        run: |
          set -e

          echo "=== Available schemes ==="

          xcodebuild \
            -project "extracted/DCDSBFresh.xcodeproj" \
            -list

          SCHEME=$(xcodebuild \
            -project "extracted/DCDSBFresh.xcodeproj" \
            -list 2>/dev/null |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Could not automatically find an Xcode scheme."
            exit 1
          fi

          echo "Using scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Build unsigned app
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          echo "=== Building scheme: $SCHEME ==="

          xcodebuild \
            -project "extracted/DCDSBFresh.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Find built app
        shell: bash
        run: |
          set -e

          echo "=== Searching for .app ==="

          APP=$(find "$PWD/build/Build/Products" \
            -type d \
            -name "*.app" \
            -path "*-iphoneos/*" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced."
            echo ""
            echo "=== Build directory ==="
            find "$PWD/build" -maxdepth 8 -print
            exit 1
          fi

          echo "Found app:"
          echo "$APP"

          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          rm -f DCDSBFresh-Unsigned.ipa

          cd Payload
          zip -r "../DCDSBFresh-Unsigned.ipa" ./*.app
          cd ..

          echo "=== IPA created ==="
          ls -lh DCDSBFresh-Unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DCDSBFresh-Unsigned-IPA
          path: DCDSBFresh-Unsigned.ipa
          if-no-files-found: error
