name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fixed.zip
        shell: bash
        run: |
          set -e
          rm -rf extracted Payload build
          mkdir -p extracted
          unzip -q fixed.zip -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 3 -print

      - name: Check project
        shell: bash
        run: |
          set -e

          PROJECT="extracted/DCDSBFresh.xcodeproj"
          PBXPROJ="$PROJECT/project.pbxproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: DCDSBFresh.xcodeproj was not found."
            exit 1
          fi

          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: project.pbxproj was not found."
            exit 1
          fi

          echo "Found project:"
          echo "$PROJECT"

          echo ""
          echo "=== Project header ==="
          head -30 "$PBXPROJ"

      - name: Repair project objectVersion
        shell: bash
        run: |
          set -e

          PBXPROJ="extracted/DCDSBFresh.xcodeproj/project.pbxproj"

          OBJECT_VERSION=$(grep -E "^[[:space:]]*objectVersion[[:space:]]*=" "$PBXPROJ" | head -1 | grep -oE "[0-9]+" || true)

          echo "Detected objectVersion: ${OBJECT_VERSION:-MISSING}"

          if [ -z "$OBJECT_VERSION" ]; then
            echo "objectVersion is missing. Adding objectVersion = 77."

            sed -i '' '/archiveVersion = 1;/a\
	objectVersion = 77;
' "$PBXPROJ"

          elif [ "$OBJECT_VERSION" = "0" ]; then
            echo "objectVersion is 0. Changing it to 77."

            sed -i '' 's/objectVersion = 0;/objectVersion = 77;/' "$PBXPROJ"
          else
            echo "objectVersion is already $OBJECT_VERSION."
          fi

          echo ""
          echo "=== Updated project header ==="
          head -30 "$PBXPROJ"

      - name: Test Xcode project
        shell: bash
        run: |
          set -e

          echo "=== Running xcodebuild -list ==="

          xcodebuild \
            -project "extracted/DCDSBFresh.xcodeproj" \
            -list

      - name: Find scheme
        shell: bash
        run: |
          set -e

          echo "=== Finding scheme ==="

          xcodebuild \
            -project "extracted/DCDSBFresh.xcodeproj" \
            -list > schemes.txt

          cat schemes.txt

          SCHEME=$(awk '
            /Schemes:/ {
              found=1
              next
            }
            found && NF {
              gsub(/^[ \t]+|[ \t]+$/, "")
              print
              exit
            }
          ' schemes.txt)

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No scheme found."
            exit 1
          fi

          echo "Selected scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Build unsigned app
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          echo "=== Building unsigned app ==="
          echo "Scheme: $SCHEME"

          xcodebuild \
            -project "extracted/DCDSBFresh.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Find app
        shell: bash
        run: |
          set -e

          echo "=== Searching for app ==="

          APP=$(find "$PWD/build/Build/Products" \
            -type d \
            -name "*.app" \
            -path "*-iphoneos/*" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced."

            echo ""
            echo "=== Build directory ==="
            find "$PWD/build" -maxdepth 8 -print

            exit 1
          fi

          echo "Found app:"
          echo "$APP"

          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          rm -f DCDSBFresh-Unsigned.ipa

          cd Payload
          zip -r "../DCDSBFresh-Unsigned.ipa" ./*.app
          cd ..

          echo "=== IPA created ==="
          ls -lh DCDSBFresh-Unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DCDSBFresh-Unsigned-IPA
          path: DCDSBFresh-Unsigned.ipa
          if-no-files-found: error
