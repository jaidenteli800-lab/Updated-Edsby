name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fixed.zip
        shell: bash
        run: |
          set -e

          rm -rf extracted Payload build
          mkdir -p extracted

          unzip -q fixed.zip -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 3 -print

      - name: Check and repair Xcode project
        shell: bash
        run: |
          set -e

          PROJECT="extracted/DCDSBFresh.xcodeproj"
          PBXPROJ="$PROJECT/project.pbxproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: $PROJECT was not found."
            exit 1
          fi

          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: $PBXPROJ was not found."
            exit 1
          fi

          echo "=== Original project header ==="
          head -40 "$PBXPROJ"

          echo ""
          echo "=== Checking objectVersion ==="

          OBJECT_VERSION=$(grep -E '^[[:space:]]*objectVersion[[:space:]]*=' "$PBXPROJ" \
            | head -1 \
            | sed 's/[^0-9]//g' || true)

          echo "Detected objectVersion: ${OBJECT_VERSION:-MISSING}"

          # Xcode 26 can read modern project formats.
          # If the project has a missing/invalid objectVersion,
          # repair it to a supported modern value.
          if [ -z "$OBJECT_VERSION" ] || [ "$OBJECT_VERSION" = "0" ]; then
            echo "Invalid/missing objectVersion detected."
            echo "Adding objectVersion = 77."

            python3 - <<'PY'
from pathlib import Path

path = Path("extracted/DCDSBFresh.xcodeproj/project.pbxproj")
text = path.read_text()

if "objectVersion =" not in text:
    text = text.replace(
        "archiveVersion = 1;",
        "archiveVersion = 1;\n\tobjectVersion = 77;",
        1
    )
else:
    import re
    text = re.sub(
        r"objectVersion\s*=\s*\d+\s*;",
        "objectVersion = 77;",
        text,
        count=1
    )

path.write_text(text)
PY
          fi

          echo ""
          echo "=== Repaired project header ==="
          head -40 "$PBXPROJ"

      - name: Validate Xcode project
        shell: bash
        run: |
          set -e

          echo "=== Testing Xcode project ==="

          xcodebuild \
            -project "extracted/DCDSBFresh.xcodeproj" \
            -list

      - name: Find Xcode scheme
        shell: bash
        run: |
          set -e

          echo "=== Available schemes ==="

          xcodebuild \
            -project "extracted/DCDSBFresh.xcodeproj" \
            -list

          SCHEME=$(
            xcodebuild \
              -project "extracted/DCDSBFresh.xcodeproj" \
              -list 2>/dev/null |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            '
          )

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme was found."
            echo ""
            echo "The project may not contain a shared scheme."
            exit 1
          fi

          echo "Using scheme: $SCHEME"

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Build unsigned app
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          echo "=== Building ==="
          echo "Project: DCDSBFresh.xcodeproj"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -project "extracted/DCDSBFresh.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Find built app
        shell: bash
        run: |
          set -e

          echo "=== Searching for .app ==="

          APP=$(find "$PWD/build/Build/Products" \
            -type d \
            -name "*.app" \
            -path "*-iphoneos/*" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced."

            echo ""
            echo "=== Build directory ==="
            find "$PWD/build" -maxdepth 8 -print

            exit 1
          fi

          echo "Found:"
          echo "$APP"

          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          rm -f DCDSBFresh-Unsigned.ipa

          cd Payload
          zip -r "../DCDSBFresh-Unsigned.ipa" ./*.app
          cd ..

          echo ""
          echo "=== IPA created ==="
          ls -lh DCDSBFresh-Unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DCDSBFresh-Unsigned-IPA
          path: DCDSBFresh-Unsigned.ipa
          if-no-files-found: error
