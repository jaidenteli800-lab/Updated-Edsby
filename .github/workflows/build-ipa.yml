name: Build DCDSB Fresh IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract DCDSB Fresh source
        run: |
          rm -rf source
          mkdir -p source

          unzip -q fixed.zip -d source

          echo "Extracted files:"
          find source -maxdepth 3 -type f | sort

      - name: Find Xcode project
        run: |
          PROJECT=$(find source -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj found inside fixed.zip"
            exit 1
          fi

          echo "Found project:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Find workspace if available
        run: |
          WORKSPACE=$(find source -name "*.xcworkspace" -type d | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            echo "Found workspace:"
            echo "$WORKSPACE"
            echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Import Apple certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/apple_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain \
            -p "$CERTIFICATE_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$CERTIFICATE_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Show signing identities
        run: |
          security find-identity -v -p codesigning

      - name: Build and archive
        run: |
          if [ -n "${WORKSPACE:-}" ]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme DCDSBFresh \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/DCDSBFresh.xcarchive" \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}" \
              clean archive
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme DCDSBFresh \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$RUNNER_TEMP/DCDSBFresh.xcarchive" \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}" \
              clean archive
          fi

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ secrets.APP_BUNDLE_ID }}</key>
                  <string>${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}</string>
              </dict>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          rm -rf "$RUNNER_TEMP/export"
          mkdir -p "$RUNNER_TEMP/export"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/DCDSBFresh.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Collect IPA
        run: |
          mkdir -p artifacts

          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" -type f | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA was not produced."
            exit 1
          fi

          cp "$IPA" artifacts/DCDSBFresh.ipa

          echo "IPA created successfully:"
          ls -lh artifacts/DCDSBFresh.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DCDSB-Fresh-IPA
          path: artifacts/DCDSBFresh.ipa
          if-no-files-found: error
